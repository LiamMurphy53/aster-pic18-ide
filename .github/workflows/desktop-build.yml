name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Windows/**', '.github/workflows/desktop-build.yml', 'Web/**', 'Resources/**', 'Sources/**', 'build.sh', 'package.sh']
  pull_request:
    paths: ['Windows/**', '.github/workflows/desktop-build.yml', 'Web/**', 'Resources/**', 'Sources/**', 'build.sh', 'package.sh']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version tag to publish after both builds pass
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
        working-directory: Windows
      - name: Verify file protection and debugger protocol
        run: npm test
        working-directory: Windows
      - name: Package Windows installer and ZIP
        run: npm run dist
        working-directory: Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application opens its editor and bridge
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/windows/win-unpacked/Aster.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Application startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Application startup failed: $($process.ExitCode)" }
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package universal Mac application
        run: bash package.sh
      - name: Verify Apple Silicon and Intel slices
        run: lipo -verify_arch arm64 x86_64 build/Aster.app/Contents/MacOS/Aster
      - uses: actions/upload-artifact@v4
        with:
          name: macos-downloads
          path: |
            dist/*macOS*.zip
            dist/*macOS*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish both operating systems
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0-windows-preview.1' }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *preview* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" downloads/* --target "$GITHUB_SHA" --title "Aster $RELEASE_TAG — macOS and Windows" --notes "Download the macOS universal ZIP or Windows x64 Setup installer below. See the repository README for installation and Microchip toolchain setup. Windows is an initial preview: installer startup, editor bridge, file protection and debugger protocol are checked automatically; real Windows Microchip compilation/simulation and physical PICkit/serial hardware still require bench validation." "${flags[@]}"
